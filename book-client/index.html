<script>
    const route = "http://localhost:3000/books";
    const booksRoute = "http://localhost:3000/books";
    const loginRoute = "http://localhost:3000/login";
    const logoutRoute = "http://localhost:3000/logout";
    
    let booksList = [];
    
    const defaultEditSvg = `
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path opacity="0.5" fill-rule="evenodd" clip-rule="evenodd" d="M3.25 22C3.25 21.5858 3.58579 21.25 4 21.25H20C20.4142 21.25 20.75 21.5858 20.75 22C20.75 22.4142 20.4142 22.75 20 22.75H4C3.58579 22.75 3.25 22.4142 3.25 22Z" fill="#fff"></path> <path opacity="0.5" d="M19.0807 7.37162C20.3095 6.14279 20.3095 4.15046 19.0807 2.92162C17.8519 1.69279 15.8595 1.69279 14.6307 2.92162L13.9209 3.63141C13.9306 3.66076 13.9407 3.69052 13.9512 3.72066C14.2113 4.47054 14.7022 5.45356 15.6256 6.37698C16.549 7.30039 17.532 7.79126 18.2819 8.05142C18.3119 8.06183 18.3415 8.07187 18.3708 8.08155L19.0807 7.37162Z" fill="#fff"></path> <path d="M13.9511 3.59961L13.9205 3.63017C13.9303 3.65952 13.9403 3.68928 13.9508 3.71942C14.211 4.4693 14.7018 5.45232 15.6252 6.37574C16.5487 7.29915 17.5317 7.79002 18.2816 8.05018C18.3113 8.0605 18.3407 8.07046 18.3696 8.08005L11.5198 14.9299C11.058 15.3917 10.827 15.6227 10.5724 15.8213C10.2721 16.0555 9.94711 16.2564 9.60326 16.4202C9.31177 16.5591 9.00196 16.6624 8.38235 16.869L5.11497 17.9581C4.81005 18.0597 4.47388 17.9804 4.24661 17.7531C4.01934 17.5258 3.93998 17.1897 4.04162 16.8847L5.13074 13.6173C5.33728 12.9977 5.44055 12.6879 5.57947 12.3964C5.74334 12.0526 5.94418 11.7276 6.17844 11.4273C6.37702 11.1727 6.60794 10.9418 7.06971 10.48L13.9511 3.59961Z" fill="#fff"></path> </g></svg>
    `;
    const activeEditSvg = `
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path opacity="0.5" d="M14.9522 3C13.9146 3 13.0796 3.83502 11.4096 5.50506L6.5 10.4146L13.5854 17.5L18.4949 12.5904C20.165 10.9204 21 10.0854 21 9.04776C21 8.01013 20.165 7.1751 18.4949 5.50506C16.8249 3.83502 15.9899 3 14.9522 3Z" fill="#fff"></path> <path d="M13.5854 17.5001L6.5 10.4147L5.50506 11.4096C3.83502 13.0796 3 13.9147 3 14.9523C3 15.9899 3.83502 16.825 5.50506 18.495C7.1751 20.165 8.01013 21.0001 9.04776 21.0001C10.0854 21.0001 10.9204 20.165 12.5904 18.495L13.5854 17.5001Z" fill="#fff"></path> <g opacity="0.5"> <path d="M9.03264 21H9C9.01086 21.0003 9.02174 20.9999 9.03264 21Z" fill="#fff"></path> <path d="M9.06287 21C9.85928 20.9938 10.5389 20.4938 11.5734 19.5L21 19.5C21.4142 19.5 21.75 19.8358 21.75 20.25C21.75 20.6642 21.4142 21 21 21H9.06287Z" fill="#fff"></path> </g> </g></svg>
    `;
    
    function showAlert(message, type = "info") {
        const toastContainer = document.getElementById("toastContainer");
        
        const alert = document.createElement("div");
        alert.className = `alert alert-${type}`;
        alert.innerHTML = `<span>${message}</span>`;
        
        toastContainer.appendChild(alert);
        
        setTimeout(() => {
            alert.remove();
        }, 5000);
    }
    
    function authHeaders() {
        return {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + sessionStorage.getItem("token")
        };
    }
    
    function setUI() {
        document.getElementById("loginCard").style.display = "none";
        document.getElementById("logoutBtn").style.display = "inline-block";
        document.getElementById("booksSection").style.display = "flex";
        document.getElementById("addEditTitle").innerHTML = "Add Book";
    }
    
    async function login() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        
        try {
            const response = await fetch(loginRoute, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username,
                    password
                })
            });
            
            if (!response.ok) {
                throw new Error();
            }
            
            const data = await response.json();
            
            sessionStorage.setItem("token", data.token);
            sessionStorage.setItem("user", JSON.stringify(data.user));
            
            setUI();
            
            showAlert("Logged in successfully.", "success");
            
            listBooks();
            
            checkRole();
        }
        catch {
            showAlert("Invalid username or password.", "error");
        }
    }
    
    function checkRole() {
        const user = JSON.parse(sessionStorage.getItem("user"));
        const isAdmin = user && user.role === "admin";
        const isUser = user && user.role === "user";
        const role = document.getElementById("role");
        const form = document.getElementById("addEditBookForm");
        
        if (isAdmin) {
            form.style.display = "block";
        } else {
            form.style.display = "none";
        }
        
        document.getElementById("role").innerHTML = user ? `Welcome ${user.username}` : "";
        
        return user ? user.role : null;
    }
    
    function resetUI() {
        document.getElementById("loginCard").style.display = "block";
        document.getElementById("logoutBtn").style.display = "none";
        document.getElementById("booksSection").style.display = "none";
        document.getElementById("bookData").innerHTML = "";
        document.getElementById("role").innerHTML = "";
    }
    
    async function logout() {
        try {
            const result = await fetch(logoutRoute, {
                method: "POST",
                headers: authHeaders()
            });
            
            if(result) {
                sessionStorage.clear();
                
                resetUI();
                
                showAlert('Logged out successfully.', 'success');
            };
        } catch(error) {
            console.error(error);
        }
    }
    
    async function listBooks() {
        const tableHead = document.getElementById("tableHead");
        const bookData = document.getElementById("bookData");
        
        try {
            const response = await fetch(booksRoute, {
                headers: authHeaders()
            });
            
            if (!response.ok) {
                throw new Error("Error fetching books.");
            }
            
            const books = await response.json();
            booksList = books;
            bookData.innerHTML = "";
            
            const userRole = checkRole();
            const isAdmin = userRole === "admin";
            
            tableHead.innerHTML =  `
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Genre</th>
                    <th>Year</th>
                    <th>Available</th>
                    ${ isAdmin ? `<th class='text-center'>Action</th>` : "" }
                </tr>
            `;

            console.log(error);

    async function addBook() {
        const title = document.getElementById("title").value;
        const author = document.getElementById("author").value;
        const genre = document.getElementById("genre").value;
        const year = document.getElementById("year").value;
        const available = document.getElementById("available").value;
        
        if (title === "" || author === "" || genre === "" || year === "" || available === null) {
            return showAlert("Please enter title, author, genre, year, and availability.", "warning");
        }
        
        const newBook = {
            title: title,
            author: author,
            genre: genre,
            year: Number(year),
            available,
        };
        
        try {
            const response = await fetch(booksRoute, {
                method: "POST",
                headers: authHeaders(),
                body: JSON.stringify(newBook)
            });
            
            if (!response.ok) {
                throw new Error("Error adding book.");
            }
            
            const addedBook = await response.json();
            
            document.getElementById("title").value = "";
            document.getElementById("author").value = "";
            document.getElementById("genre").value = "";
            document.getElementById("year").value = "";
            
            showAlert("Book added successfully.", "success");
            
            await listBooks();
        } catch (error) {
            showAlert("Error: Unable to add book.", "error");
            console.log(error);
        }
    }
    
    function editBook(bookId) {
        const actionButtons = document.querySelectorAll(".action-btn");
        actionButtons.forEach(button => {
            button.disabled = true;
            button.style.opacity = "0.5";
        });
        
        document.getElementById("addEditBookForm").classList.add("border");
        document.getElementById("svg-container").innerHTML = activeEditSvg;
        document.getElementById("addEditTitle").innerHTML = "Edit Book";
        document.getElementById("saveUpdatesBtn").style.display = "inline-block";
        document.getElementById("addBookBtn").style.display = "none";
        document.getElementById("cancelUpdatesBtn").style.display = "inline-block";
        
        const book = booksList.find(function(element) { return element.id === bookId; });
        document.getElementById("bookIdEdit").value = book.id;
        
        document.getElementById("title").value = book.title;
        document.getElementById("author").value = book.author;
        document.getElementById("genre").value = book.genre;
        document.getElementById("year").value = book.year;
        document.getElementById("available").value = book.available ? "true" : "false";
        
        showAlert("Editing book...", "warning");
    }
    
    function resetEditUI() {
        document.getElementById("bookIdEdit").value = "";
        document.getElementById("title").value = "";
        document.getElementById("author").value = "";
        document.getElementById("genre").value = "";
        document.getElementById("year").value = "";
        
        document.getElementById("addBookBtn").style.display = "inline-block";
        document.getElementById("saveUpdatesBtn").style.display = "none";
        document.getElementById("cancelUpdatesBtn").style.display = "none";
        document.getElementById("addEditTitle").innerHTML = "Add Book";
        document.getElementById("svg-container").innerHTML = defaultEditSvg;
        document.getElementById("addEditBookForm").classList.remove("border");
    }
    
    async function saveEditBook() {
        const actionButtons = document.querySelectorAll(".action-btn");
        actionButtons.forEach(button => {
            button.disabled = false;
            button.style.opacity = "1";
        });
        
        const bookId = document.getElementById("bookIdEdit").value;
        // document.getElementById("addBookBtn").style.display = "none";
        const title = document.getElementById("title").value;
        const author = document.getElementById("author").value;
        const genre = document.getElementById("genre").value;
        const year = document.getElementById("year").value;
        const available = document.getElementById("available").value === "true";
        
        if (bookId === "") {
            return showAlert("No book selected for editing.", "warning");
        }
        
        if (title === "" || author === "" || genre === "" || year === "" || available === null) {
            return showAlert("Please enter title, author, genre, and year.", "warning");
        }
        
        const editedBook = {
            title,
            author,
            genre,
            year: Number(year),
            available,
        };
        
        try {
            const response = await fetch(booksRoute + "/" + bookId, {
                method: "PUT",
                headers: authHeaders(),
                body: JSON.stringify(editedBook)
            });
            
            if (!response.ok) {
                throw new Error("Error updating book.");
            }
            
            const newBook = await response.json();
            
            resetEditUI();
            
            showAlert("Book updated successfully.", "success");
            
            await listBooks();
        } catch (error) {
            showAlert("Error: Unable to update book.", "error");
            console.log(error);
        }
    }
    
    function cancelEditBook() {
        const actionButtons = document.querySelectorAll(".action-btn");
        actionButtons.forEach(button => {
            button.disabled = false;
            button.style.opacity = "1";
        });
        
        resetEditUI();
        
        showAlert("Book editing cancelled.", "warning");
    }
    
    let bookToDelete = null;
    
    function confirmDeleteBook(bookId) {
        bookToDelete = bookId;
        document.getElementById("my_modal").showModal();
    }
    
    async function deleteBook() {
        if (bookToDelete === null) return;
        
        try {
            const response = await fetch(`${booksRoute}/${bookToDelete}`, {
                method: "DELETE",
                headers: authHeaders()
            });
            
            if (!response.ok) {
                throw new Error("Error deleting book.");
            }
            
            document.getElementById("my_modal").close();
            bookToDelete = null;
            
            showAlert("Book deleted successfully.", "success");
            await listBooks();
        } catch (err) {
            showAlert("Error: Unable to delete book.", "error");
        }
    }
    
    if (sessionStorage.getItem("token")) {
        setUI();
        checkRole();
        listBooks();
    }
</script>
