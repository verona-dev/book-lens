</head>

<body class="flex flex-col items-center">

<main class="flex flex-col items-center justify-center gap-12 p-6 w-full h-full max-w-[1700px] mx-auto">
    <!-- Login  -->
    <div id="loginCard" class="card bg-neutral w-120 flex flex-col p-6 shadow-lg rounded-2xl">
        <div class="card-body gap-12">
            <div class="flex justify-center items-center gap-3">
                <div class="w-10">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M16 6C16 8.20914 14.2091 10 12 10C9.79086 10 8 8.20914 8 6C8 3.79086 9.79086 2 12 2C14.2091 2 16 3.79086 16 6Z" fill="#fff"></path> <path fill-rule="evenodd" clip-rule="evenodd" d="M16.5 22C14.8501 22 14.0251 22 13.5126 21.4874C13 20.9749 13 20.1499 13 18.5C13 16.8501 13 16.0251 13.5126 15.5126C14.0251 15 14.8501 15 16.5 15C18.1499 15 18.9749 15 19.4874 15.5126C20 16.0251 20 16.8501 20 18.5C20 20.1499 20 20.9749 19.4874 21.4874C18.9749 22 18.1499 22 16.5 22ZM18.468 17.7458C18.6958 17.518 18.6958 17.1487 18.468 16.9209C18.2402 16.693 17.8709 16.693 17.6431 16.9209L15.7222 18.8417L15.3569 18.4764C15.1291 18.2486 14.7598 18.2486 14.532 18.4764C14.3042 18.7042 14.3042 19.0736 14.532 19.3014L15.3097 20.0791C15.5375 20.307 15.9069 20.307 16.1347 20.0791L18.468 17.7458Z" fill="#fff"></path> <path opacity="0.5" d="M14.4774 21.9208C13.7513 21.9728 12.9296 22 12 22C4 22 4 19.9853 4 17.5C4 15.0147 7.58172 13 12 13C14.8806 13 17.4056 13.8564 18.8142 15.1412C18.298 15 17.5737 15 16.5 15C14.8501 15 14.0251 15 13.5126 15.5126C13 16.0251 13 16.8501 13 18.5C13 20.1499 13 20.9749 13.5126 21.4874C13.7501 21.725 14.0547 21.8524 14.4774 21.9208Z" fill="#fff"></path> </g></svg>
                    </svg>
                </div>
                <h2 class="text-4xl font-bold text-center">Admin Login</h2>
            </div>
            
            <div class="flex flex-col gap-6">
                <div class="flex flex-col gap-2">
                    <label class="text-lg">Username</label>
                    <input type="text" id="username" class="input w-full">
                </div>
                <div class="flex flex-col gap-2">
                    <label class="text-lg">Password</label>
                    <input type="password" id="password" class="input w-full">
                </div>
            </div>
            
            <div class="flex flex-col gap-6">
                <button onclick="login()" class="btn btn-info mt-4">Login</button>
                
                <!-- Admin Login Button  -->
                <button class="btn btn-link">
                    <a href="index.html">Go to Book Dashboard</a>
                </button>
            </div>
        </div>
    </div>
    
    <!-- Users  -->
    <div id="usersSection" style="display:none" class="flex flex-col w-full">
        <h2 class="text-3xl font-bold ml-8"><span id="role"></span></h2>
        
        <div class="flex flex-row gap-8 p-6 w-full">
            <!-- Add User -->
            <div id="addUserForm" class="card bg-neutral xl:w-160 h-110 flex flex-col gap-6 px-4 py-6 shadow-lg rounded-2xl border-info">
                <div class="card-body justify-between p-4 h-full">
                    <div class="flex items-center gap-3">
                        <div id="svg-container" class="w-10">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M16 6C16 8.20914 14.2091 10 12 10C9.79086 10 8 8.20914 8 6C8 3.79086 9.79086 2 12 2C14.2091 2 16 3.79086 16 6Z" fill="#fff"></path> <path opacity="0.5" d="M14.4774 21.9208C13.7513 21.9728 12.9296 22 12 22C4 22 4 19.9853 4 17.5C4 15.0147 7.58172 13 12 13C14.8806 13 17.4056 13.8564 18.8142 15.1412C18.298 15 17.5737 15 16.5 15C14.8501 15 14.0251 15 13.5126 15.5126C13 16.0251 13 16.8501 13 18.5C13 20.1499 13 20.9749 13.5126 21.4874C13.7501 21.725 14.0547 21.8524 14.4774 21.9208Z" fill="#fff"></path> <path fill-rule="evenodd" clip-rule="evenodd" d="M16.5 22C14.8501 22 14.0251 22 13.5126 21.4874C13 20.9749 13 20.1499 13 18.5C13 16.8501 13 16.0251 13.5126 15.5126C14.0251 15 14.8501 15 16.5 15C18.1499 15 18.9749 15 19.4874 15.5126C20 16.0251 20 16.8501 20 18.5C20 20.1499 20 20.9749 19.4874 21.4874C18.9749 22 18.1499 22 16.5 22ZM17.0833 16.9444C17.0833 16.6223 16.8222 16.3611 16.5 16.3611C16.1778 16.3611 15.9167 16.6223 15.9167 16.9444V17.9167H14.9444C14.6223 17.9167 14.3611 18.1778 14.3611 18.5C14.3611 18.8222 14.6223 19.0833 14.9444 19.0833H15.9167V20.0556C15.9167 20.3777 16.1778 20.6389 16.5 20.6389C16.8222 20.6389 17.0833 20.3777 17.0833 20.0556V19.0833H18.0556C18.3777 19.0833 18.6389 18.8222 18.6389 18.5C18.6389 18.1778 18.3777 17.9167 18.0556 17.9167H17.0833V16.9444Z" fill="#fff"></path> </g></svg>                        </div>
                        <h2 class="text-4xl font-bold">Add User</h2>
                    </div>
                    <div class="flex flex-col gap-2">
                        <input type="hidden" id="userIdEdit">
                        <div class="flex flex-col gap-2">
                            <label for="username">Username:</label>
                            <input type="text" id="newUsername" class="input w-full input-sm">
                        </div>
                        <div class="flex flex-col gap-2">
                            <label for="password">Password:</label>
                            <input type="password" id="newPassword" class="input w-full input-sm">
                        </div>
                        <div class="flex flex-col gap-2">
                            <label for="role">Role:</label>
                            <select id="newRole" class="select w-full select-sm">
                                <option value="user">User</option>
                                <option value="admin">Admin</option>
                            </select>
                        </div>
                    </div>
                    <div class="flex justify-center items-center gap-2">
                        <button id="addUserBtn" onclick="addUser()" class="btn btn-info w-full">Add User</button>
                    </div>
                </div>
            </div>
            
            <!-- Users Table -->
            <div class="card bg-neutral w-full gap-6 p-6 shadow-lg rounded-2xl">
                <div class="card-body gap-12 items-center">
                    <div class="flex items-center gap-3">
                        <div class='w-10'>
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <circle opacity="0.4" cx="15" cy="6" r="3" fill="#fff"></circle> <ellipse opacity="0.4" cx="16" cy="17" rx="5" ry="3" fill="#fff"></ellipse> <circle cx="9.00098" cy="6" r="4" fill="#fff"></circle> <ellipse cx="9.00098" cy="17.001" rx="7" ry="4" fill="#fff"></ellipse> </g></svg>
                        </div>
                        <h2 class="text-4xl font-bold">Users</h2>
                    </div>
                    <span id="loading" class="text-xl">Loading...</span>
                    <div class="overflow-x-auto rounded-box w-full">
                        <table class="table table-zebra min-h-80">
                            <thead id="tableHead"></thead>
                            <tbody id="userData"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Status Notification -->
<div id="toastContainer" class="toast toast-center"></div>
</body>
</html>

<script>
    const usersRoute = "http://localhost:3000/users";
    const loginRoute = "http://localhost:3000/admin/login";
    const logoutRoute = "http://localhost:3000/logout";
    
    let usersList = [];
    
    function showAlert(message, type = "info") {
        const toastContainer = document.getElementById("toastContainer");
        
        const alert = document.createElement("div");
        alert.className = `alert alert-${type}`;
        alert.innerHTML = `<span>${message}</span>`;
        
        toastContainer.appendChild(alert);
        
        setTimeout(() => {
            alert.remove();
        }, 5000);
    }
    
    function authHeaders() {
        return {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + sessionStorage.getItem("token")
        };
    }
    
    function setUI() {
        document.getElementById("loginCard").style.display = "none";
        document.getElementById("logoutBtn").style.display = "inline-block";
        document.getElementById("usersSection").style.display = "flex";
    }
    
    async function login() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        
        try {
            const response = await fetch(loginRoute, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username,
                    password
                })
            });
            
            if (!response.ok) {
                throw new Error();
            }
            
            const data = await response.json();
            
            sessionStorage.setItem("token", data.token)
            sessionStorage.setItem("user", JSON.stringify(data.user));
            
            setUI();
            
            showAlert("Logged in successfully.", "success");
            
            checkRole();
            
            await listUsers();
        }
        catch(error) {
            console.error(error);
            showAlert("Invalid username or password. Only admin can login.", "error");
        }
    }
    
    function resetUI() {
        document.getElementById("loginCard").style.display = "block";
        document.getElementById("logoutBtn").style.display = "none";
        document.getElementById("usersSection").style.display = "none";
        document.getElementById("role").innerHTML = "";
    }
    
    async function logout() {
        try {
            const result = await fetch(logoutRoute, {
                method: "POST",
                headers: authHeaders()
            });
            
            if(result.ok) {
                sessionStorage.clear();
                
                resetUI();
                
                showAlert('Logged out successfully.', 'success');
            };
        } catch(error) {
            console.error(error);
        }
    }
    
    function checkRole() {
        const user = JSON.parse(sessionStorage.getItem("user"));
        const role = document.getElementById("role");
        const isAdmin = user && user.role === "admin";
        
        role.innerHTML = user ? `Welcome ${user.username}` : "";
        
        return user ? user.role : null;
    }
    
    async function listUsers() {
        const tableHead = document.getElementById("tableHead");
        const userData = document.getElementById("userData");
        
        try {
            const response = await fetch(usersRoute, {
                headers: authHeaders()
            });
            
            if (!response.ok) {
                throw new Error("Error fetching users.");
            }
            
            const users = await response.json();
            usersList = users;
            userData.innerHTML = "";
            
            const userRole = checkRole();
            const isAdmin = userRole === "admin";
            
            tableHead.innerHTML = `
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Role</th>
                    <th>Active</th>
                </tr>
            `;
            
            for (let i = 0; i < users.length; i++) {
                const user = users[i];
                userData.innerHTML += `
                    <tr class="hover:bg-base-300">
                        <td><span class="badge badge-soft badge-sm badge-info">${user.id}</span></td>
                        <td>${user.username}</td>
                        <td>${user.role}</td>
                        <td>${user.active ? "Yes" : "No"}</td>
                    </tr>
                `;
            }
            
            document.getElementById("loading").style.display = "none";
        } catch (error) {
            showAlert("Error: Unable to load users.", "error");
            console.log(error);
        }
    }
    
    async function addUser() {
        const username = document.getElementById("newUsername").value;
        const password = document.getElementById("newPassword").value;
        const role = document.getElementById("newRole").value;
        
        if (username === "" || password === "" || role === "") {
            return showAlert("Please enter username, password, and role.", "warning");
        }
        
        const newUser = {
            username,
            password,
            role
        };
        
        try {
            const response = await fetch(usersRoute, {
                method: "POST",
                headers: authHeaders(),
                body: JSON.stringify(newUser)
            });
            
            if (!response.ok) {
                throw new Error("Error adding user.");
            }
            
            const addedUser = await response.json();
            console.log("Added user:", addedUser);
            
            document.getElementById("newUsername").value = "";
            document.getElementById("newPassword").value = "";
            document.getElementById("newRole").value = "user";
            
            showAlert("User added successfully.", "success");
            await listUsers();
        } catch (error) {
            showAlert("Error: Unable to add user.", "error");
            console.log(error);
        }
    }
    
    if (sessionStorage.getItem("token")) {
        setUI();
        checkRole();
        listUsers();
    }
</script>
